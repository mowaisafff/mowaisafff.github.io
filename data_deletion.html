<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Deletion Request</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #111827;
    }
    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    textarea { resize: vertical; min-height: 90px; }
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.4;
    }
    .checkbox-row input { width: auto; margin-top: 3px; }
    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success { display: block; background: #d1fae5; color: #065f46; }
    .status.error { display: block; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Data Deletion Request</h1>
    <p class="subtitle">
      Submit this form to request deletion of your personal data. We will process
      your request within 30 days.
    </p>

    <form id="deletionForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="app">App / Service Name</label>
      <input type="text" id="app" name="app" placeholder="e.g. My Game App" required>

      <label for="reason">Reason (optional)</label>
      <textarea id="reason" name="reason" placeholder="Any additional details..."></textarea>

      <div class="checkbox-row">
        <input type="checkbox" id="confirm" required>
        <label for="confirm" style="font-weight: normal; margin: 0;">
          I confirm that I am the owner of the data associated with this email
          and understand that deletion is permanent.
        </label>
      </div>

      <button type="submit" id="submitBtn">Submit Request</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script>
    const form = document.getElementById('deletionForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      status.className = 'status';
      status.style.display = 'none';

      // Uses FormSubmit (free, no backend needed).
      // First submission to a new email requires a one-time confirmation click.
      const endpoint = 'https://formsubmit.co/ajax/mowais.addd@gmail.com';

      const payload = {
        _subject: 'Data Deletion Request',
        _template: 'table',
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        app: document.getElementById('app').value,
        reason: document.getElementById('reason').value || 'Not provided',
        submitted_at: new Date().toISOString()
      };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok) {
          status.className = 'status success';
          status.textContent =
            '✅ Your request has been submitted. You will receive a confirmation email shortly.';
          form.reset();
        } else {
          throw new Error(data.message || 'Submission failed');
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent =
          '❌ Something went wrong. Please email mowais.addd@gmail.com directly.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Request';
      }
    });
  </script>
</body>
</html>
